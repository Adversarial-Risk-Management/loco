[package]
name = "loco-encryption-example"
version = "0.1.0"
edition = "2021"
publish = false
description = "A minimal Loco app demonstrating model field encryption."

[dependencies]
loco-rs = { path = "../..", features = ["encryption", "cli"] }
async-trait = "0.1"
axum = "0.8"
sea-orm = { version = "2.0", features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
sea-orm-migration = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[[bin]]
name = "encryption-example"
path = "src/main.rs"
